[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-backend"
version = "0.1.0"
description = "ambient-streamer control plane: configuration, media resolution, ffmpeg command assembly"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Only zmqctl needs a broker library; the validator imports without it.
zmq = ["pyzmq>=25"]
dev = ["pytest>=8"]

[project.scripts]
ambient-compile = "ambient.compile:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ambient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
