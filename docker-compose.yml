# ambient-streamer — global stack.
#
# Three global containers, plus two per channel started as separate compose
# projects from docker/compose.channel.yml.j2. At the maximum of 8 channels that
# is 19 containers, not 40.
#
#   scripts/install.sh            <- first, once. Writes .env and its secrets.
#   docker compose -p ambient up -d
#
# The backend and HLS directory publish to loopback by default. MediaMTX RTMP,
# its control API, and Icecast stay on the internal network. Keeping the relay
# publishing surface and the ZMQ control sockets off the LAN is the point.

name: ambient

services:
  # ---------------------------------------------------------------------------
  # Icecast — the audio relay between Liquidsoap and every compositor.
  #
  # ONE instance serves every channel's mount. It is not optional and not per
  # channel: it is what makes a Liquidsoap restart invisible to the compositor
  # (measured 0s / 0.00% silence, versus 18.19s for output.harbor).
  # See docs/contracts/audio-transport.md.
  # ---------------------------------------------------------------------------
  icecast:
    image: libretime/icecast:2.4.4
    container_name: ambient-icecast
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/usr/local/bin/icecast-entrypoint.sh"]
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env — openssl rand -hex 16}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set in .env — openssl rand -hex 16}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?set in .env — openssl rand -hex 16}
      ICECAST_PORT: ${AMBIENT_ICECAST_PORT:-8081}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
      ICECAST_MAX_SOURCES: ${ICECAST_MAX_SOURCES:-16}
      # Rendered config lives on tmpfs so the container needs no writable /etc.
      ICECAST_CONFIG: /run/icecast/icecast.xml
      TZ: ${TZ:-UTC}
    volumes:
      - ./docker/icecast-entrypoint.sh:/usr/local/bin/icecast-entrypoint.sh:ro
      - ./docker/icecast.xml:/etc/ambient/icecast.xml:ro
      # mounts.list — one channel mount per line, written by scripts/new-channel.sh.
      # Adding a channel is a SIGHUP, never a restart:
      #   docker kill -s HUP ambient-icecast
      - ${AMBIENT_DATA_DIR:-./channels}:/etc/ambient/channels:ro
      # Fallback MP3s, served through fileserve as /fallback/<channel>.mp3.
      # Generate with scripts/make-fallback.sh — they must be MP3 256k/44.1k/stereo.
      - ${AMBIENT_COMMON_DIR:-./common}/fallback:/usr/share/icecast/web/fallback:ro
    tmpfs:
      # 1777 (sticky, like /tmp): Docker creates a tmpfs owned by root, and this
      # container runs as PUID/PGID, so a stricter mode blocks the render.
      - /run/icecast:mode=1777,size=1m
    logging:
      # Bounded, because this runs for months. An unrotated json-file log is
      # how a 24/7 service fills a disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [ambient]
    # No ports. The compositor reaches this at http://icecast:8081/<mount>.

  # ---------------------------------------------------------------------------
  # MediaMTX — RTMP relay to YouTube plus the low-resolution HLS preview.
  #
  # Publishes NO host ports, by design. It does not hold a YouTube session open
  # across a composer restart; it turns an 18s backoff gap into a ~1s one.
  #
  # Built rather than pulled: the stock image has no ffmpeg, and the publisher
  # needs the argv shim that keeps stream keys out of `ps`. See
  # docker/Dockerfile.mediamtx.
  # ---------------------------------------------------------------------------
  mediamtx:
    image: ${AMBIENT_MEDIAMTX_IMAGE:-ambient-mediamtx:dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.mediamtx
    container_name: ambient-mediamtx
    restart: unless-stopped
    environment:
      AMBIENT_RTMP_PORT: ${AMBIENT_RTMP_PORT:-1935}
      TZ: ${TZ:-UTC}
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
      # The relay is the only runtime holder of a stream key: it reads
      # YOUTUBE_STREAM_KEY out of channels/<name>/.env when a path goes ready.
      # A bind mount, so adding a channel never needs this container restarted.
      - ${AMBIENT_DATA_DIR:-./channels}:/etc/ambient/channels:ro
    tmpfs:
      # Where the publisher stages a 0600 key file for the argv shim. tmpfs so
      # a stream key never touches a disk here.
      - /run/ambient:mode=0700,size=1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [ambient]
    # RTMP 1935 and the API 9997 are never published: 1935 would let anyone on
    # the network publish to a path, and 9997 can reconfigure the relay.
    # HLS 8888 is not published either — the `directory` service in front of it
    # owns that port, because MediaMTX answers 404 at `/` and cannot serve the
    # station list that makes the feeds discoverable.

  # ---------------------------------------------------------------------------
  # LAN front door on the HLS port: a station directory at `/`, and every other
  # path proxied straight to MediaMTX.
  #
  # nginx rather than the backend because this carries the media. Routing 24/7
  # HLS through the Python control plane would put a multi-megabit copy loop on
  # a host where CPU contention was measured causing a 27 s YouTube outage; here
  # only the few-KB directory page comes from the backend.
  #
  # Unauthenticated, exactly as MediaMTX was when it held this port directly.
  # The default bind is loopback; set AMBIENT_HLS_BIND=0.0.0.0 to open it to
  # players on the LAN. The backend API is deliberately NOT proxied.
  directory:
    image: nginx:1.27-alpine
    container_name: ambient-directory
    restart: unless-stopped
    environment:
      # Substituted into the template by the image's entrypoint, so changing the
      # backend port does not need this config edited by hand.
      AMBIENT_BACKEND_HOST: backend
      AMBIENT_BACKEND_PORT: ${AMBIENT_BACKEND_PORT:-8090}
      AMBIENT_RELAY_HOST: mediamtx
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    tmpfs:
      - /var/cache/nginx
    volumes:
      - ./docker/directory-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [ambient]
    ports:
      - "${AMBIENT_HLS_BIND:-127.0.0.1}:${AMBIENT_HLS_PUBLISH:-8888}:8888"
    depends_on: [mediamtx]
    deploy:
      resources:
        limits:
          cpus: "${DIRECTORY_CPU_LIMIT:-0.5}"
          memory: ${DIRECTORY_MEMORY_LIMIT:-64m}

  # ---------------------------------------------------------------------------
  # Backend control plane — FastAPI: REST, SSE, static operator UI, supervisor,
  # watchdog, scheduler.
  #
  # The repository is bind-mounted at ITS OWN HOST PATH, not at /app. This
  # process renders channels/<name>/docker-compose.yml with bind sources in it,
  # and the daemon resolves a bind source on the host — so the path the backend
  # writes and the path the daemon reads have to be the same string. Mounting
  # elsewhere produces channels that start with empty media directories.
  # scripts/install.sh writes AMBIENT_REPO_ROOT into .env.
  # ---------------------------------------------------------------------------
  backend:
    image: ${AMBIENT_BACKEND_IMAGE:-ambient-backend:dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ambient-backend
    restart: unless-stopped
    environment:
      # CONTAINER-side bind. What keeps this off the LAN is the HOST side of
      # the ports mapping below, which defaults to loopback. Binding 0.0.0.0
      # in here is also why the token below is required and not advisory:
      # main.py refuses to start without one when not on loopback.
      AMBIENT_BIND_ADDRESS: 0.0.0.0
      AMBIENT_API_TOKEN: ${AMBIENT_API_TOKEN:?unset — run scripts/install.sh, which generates one}
      AMBIENT_BACKEND_PORT: ${AMBIENT_BACKEND_PORT:-8090}
      AMBIENT_ROOT: ${AMBIENT_REPO_ROOT:?unset — run scripts/install.sh; it must be this repo's absolute host path}
      AMBIENT_LOG_DIR: ${AMBIENT_LOG_DIR:-/var/log/ambient}
      AMBIENT_RUN_DIR: ${AMBIENT_RUN_DIR:-/run/ambient}
      AMBIENT_FRONTEND_DIR: ${AMBIENT_FRONTEND_DIR:-/opt/ambient/frontend}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      # Root-equivalent on the host. This is why the published port below is
      # bound to ${AMBIENT_BIND_ADDRESS}, which defaults to loopback, why
      # AMBIENT_API_TOKEN is required rather than optional, and why the
      # entrypoint drops to PUID/PGID before exec'ing the app.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-write: the supervisor writes channels/<name>/docker-compose.yml,
      # and the media resolver writes playlist.m3u and images.list.
      - ${AMBIENT_REPO_ROOT:?}:${AMBIENT_REPO_ROOT:?}
      - ${AMBIENT_LOG_DIR:-/var/log/ambient}:${AMBIENT_LOG_DIR:-/var/log/ambient}
      # Shared with every composer. The watchdog reads each channel's progress
      # file from here; without it the watchdog is blind and restarts forever.
      - ${AMBIENT_RUN_DIR:-/run/ambient}:${AMBIENT_RUN_DIR:-/run/ambient}
    ports:
      - "${AMBIENT_BIND_ADDRESS:-127.0.0.1}:${AMBIENT_BACKEND_PORT:-8090}:${AMBIENT_BACKEND_PORT:-8090}"
    healthcheck:
      # No curl in the image, and adding one for a healthcheck is a poor trade.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          port = os.environ.get("AMBIENT_BACKEND_PORT", "8090")
          with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=4) as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # The control plane must never be what starves an encoder. It forks
          # `docker compose`, which is the memory-hungry part.
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
    networks: [ambient]
    depends_on: [icecast, mediamtx]

networks:
  ambient:
    # Fixed name so per-channel compose projects can join it as an external
    # network without depending on this project's name.
    name: ambient
    driver: bridge
